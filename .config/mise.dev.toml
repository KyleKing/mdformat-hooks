[tools]
# Pinned with the formatters in mise.ci.toml, and with the 'hougesen/mdsf' version
# input in tests.yml, which is how CI installs it. mdsf.json's '$schema' tracks this.
"cargo:mdsf" = "0.12.0"
"pipx:prek" = "latest" # In CI, installed with 'j178/prek-action'
"pipx:pytest-watcher" = "latest"
"pipx:tox" = {uvx_args = "--with tox-uv>=1.29.0", version = "4.32.0"}
python = ["3.10.15", "3.14.0"]
uv = "latest" # In CI, installed with 'astral-sh/setup-uv'
